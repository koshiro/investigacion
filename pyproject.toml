[project]
name = "investigacion"
version = "0.1.0"
description = "Investigaciones con datos públicos chilenos: evidencia inmutable, citas verificadas y aprobación humana"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "anthropic>=1.13.0",
  "argon2-cffi>=25.1.0",
  "dbos>=3.2",
  "fastapi>=0.143.0",
  "httpx>=0.28.1",
  "itsdangerous>=2.2.0",
  "jinja2>=3.1.6",
  "psycopg[binary,pool]>=3.3",
  "pydantic-settings>=2.15",
  "pyotp>=2.10.0",
  "python-multipart>=0.0.32",
  "rapidfuzz>=3.14.6",
  "structlog>=26.1",
  "uvicorn>=0.54.0",
]

[project.optional-dependencies]
# Solo la imagen de `extract` (sin red): modelos locales de datos personales. torch va en su variante CPU.
extract = [
  "presidio-analyzer>=2.2",
  "gliner>=0.2",
  "torch>=2.9",
  "torchvision>=0.24", # misma variante CPU que torch (si no, `torchvision::nms does not exist`)
  "docling>=2.60",
  "tiktoken>=0.12", # el tokenizador de GLiNER lo pide al convertir el modelo
  "sentencepiece>=0.2",
  "protobuf>=6",
]

[project.scripts]
# Un solo punto de entrada con subcomandos; el Deployment elige con `args: [...]`.
investigacion = "investigacion.cli:main"

[dependency-groups]
dev = [
  "pytest>=9.1",
  "ruff>=0.17,<0.18", # tope de menor: las versiones menores cambian las reglas por defecto
  "ty>=0.0.80",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.uv]
# Regla de la casa: dependencias con al menos dos semanas publicadas. Mover esta fecha a mano al actualizar el lock.
exclude-newer = "2026-10-13T00:00:00Z"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF"]
ignore = ["S101"] # assert en tests

[tool.ruff.lint.flake8-bugbear]
# Idioma de FastAPI: Depends() y Form() en los argumentos por defecto.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "E501", "RUF001"]
"src/investigacion/web/__init__.py" = ["E501"] # consultas SQL de una línea

[tool.pytest.ini_options]
testpaths = ["tests"]
