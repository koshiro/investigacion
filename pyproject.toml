[project]
name = "investigacion"
version = "0.1.0"
description = "Investigaciones con datos públicos chilenos: evidencia inmutable, citas verificadas y aprobación humana"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "dbos>=3.2",
  "psycopg[binary,pool]>=3.3",
  "pydantic-settings>=2.15",
  "rapidfuzz>=3.14.6",
  "structlog>=26.1",
]

[project.scripts]
# Un solo punto de entrada con subcomandos; el Deployment elige con `args: [...]`.
investigacion = "investigacion.cli:main"

[dependency-groups]
dev = [
  "pytest>=9.1",
  "ruff>=0.17,<0.18", # tope de menor: las versiones menores cambian las reglas por defecto
  "ty>=0.0.80",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv]
# Regla de la casa: dependencias con al menos dos semanas publicadas. Mover esta fecha a mano al actualizar el lock.
exclude-newer = "2026-10-13T00:00:00Z"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF"]
ignore = ["S101"] # assert en tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "E501", "RUF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
