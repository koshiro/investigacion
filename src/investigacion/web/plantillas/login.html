{% extends "base.html" %}
{% block titulo %}Ingresar{% endblock %}
{% block contenido %}
<h1>Ingresar</h1>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/login" class="columna">
  <label for="username">Usuario</label>
  <input id="username" name="usuario" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
  <label for="password">Contraseña</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <label for="totp">Código de verificación (TOTP)</label>
  <input id="totp" name="totp" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" required>
  <button type="submit">Entrar</button>
</form>
{% endblock %}
